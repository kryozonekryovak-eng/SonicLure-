name: Build XLURE VST3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure XLURE
        run: cmake -B build -S . -A x64

      - name: Build XLURE
        run: cmake --build build --config Release --parallel 2

      - name: Upload XLURE VST3
        uses: actions/upload-artifact@v4
        with:
          name: XLURE-Windows-VST3
          path: build/XLURE_artefacts/Release/VST3/XLURE.vst3
          if-no-files-found: error
