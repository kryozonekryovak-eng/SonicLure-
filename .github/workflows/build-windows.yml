
name: Build LureX VST3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure LureX
        run: cmake -B build -S . -A x64

      - name: Build LureX
        run: cmake --build build --config Release --parallel 2

      - name: Upload LureX VST3
        uses: actions/upload-artifact@v4
        with:
          name: LureX-Windows-VST3
          path: build/LureX_artefacts/Release/VST3/LureX.vst3
          if-no-files-found: error
